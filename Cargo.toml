[package]
name = "mango-layout-tray"
version = "0.1.5"
edition = "2024"
rust-version = "1.92"
description = "A visual layout picker for MangoWM, right in your system tray"
license = "MIT"
repository = "https://github.com/mikkelrask/mango-layout-tray"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_8"] }
gtk4-layer-shell = "0.8"
ksni = { version = "0.3", features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
anyhow = "1"
async-channel = "2"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
